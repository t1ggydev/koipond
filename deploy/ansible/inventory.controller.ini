# Existing trusted controller access for initial preparation, not Jenkins secrets.
[koipond_apps]
apps01 ansible_host=10.10.10.20

[koipond_edge]
edge01 ansible_host=10.10.10.10

[koipond_supabase]
supabase01 ansible_host=10.10.10.30

[all:vars]
ansible_user=infra
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/leon/.ssh/root-infra-automation
ansible_ssh_common_args='-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/leon/.ssh/root-infra-known-hosts'
