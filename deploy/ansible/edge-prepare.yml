[
  {
    "name": "Prepare private Koipond DNS TLS edge",
    "hosts": "koipond_edge",
    "gather_facts": false,
    "tasks": [
      {
        "name": "Require private preparation only",
        "ansible.builtin.assert": {
          "that": [
            "koipond_prepare_private_edge | default(false) | bool",
            "koipond_cloudflare_token | length > 20",
            "koipond_cloudflare_zone_id | length > 10"
          ]
        },
        "no_log": true
      },
      {
        "name": "Create owned edge directories",
        "ansible.builtin.file": {
          "path": "{{ item.path }}",
          "state": "directory",
          "mode": "{{ item.mode }}"
        },
        "loop": [
          {
            "path": "/srv/koipond-edge",
            "mode": "0700"
          },
          {
            "path": "/srv/koipond-edge/letsencrypt",
            "mode": "0700"
          },
          {
            "path": "/srv/koipond-edge/tls",
            "mode": "0750"
          },
          {
            "path": "/srv/koipond-edge/nginx",
            "mode": "0755"
          }
        ]
      },
      {
        "name": "Store scoped DNS challenge credential",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/cloudflare.ini",
          "content": "dns_cloudflare_api_token = {{ koipond_cloudflare_token }}\n",
          "mode": "0600"
        },
        "no_log": true
      },
      {
        "name": "Check only new DNS records",
        "ansible.builtin.uri": {
          "url": "https://api.cloudflare.com/client/v4/zones/{{ koipond_cloudflare_zone_id }}/dns_records?name={{ item }}",
          "headers": {
            "Authorization": "Bearer {{ koipond_cloudflare_token }}"
          },
          "return_content": true
        },
        "loop": [
          "koipond-stage.kluge-it.tech",
          "koipond-api.kluge-it.tech"
        ],
        "register": "koipond_dns",
        "delegate_to": "localhost",
        "become": false,
        "no_log": true,
        "vars": {
          "ansible_become": false
        }
      },
      {
        "name": "Refuse to alter existing conflicting DNS records",
        "ansible.builtin.assert": {
          "that": [
            "item.json.success",
            "item.json.result | length == 0 or (item.json.result | length == 1 and item.json.result[0].type == 'A' and item.json.result[0].content == '10.10.10.10' and not item.json.result[0].proxied)"
          ]
        },
        "loop": "{{ koipond_dns.results }}",
        "no_log": true
      },
      {
        "name": "Create missing private stage DNS only",
        "ansible.builtin.uri": {
          "url": "https://api.cloudflare.com/client/v4/zones/{{ koipond_cloudflare_zone_id }}/dns_records",
          "method": "POST",
          "headers": {
            "Authorization": "Bearer {{ koipond_cloudflare_token }}"
          },
          "body_format": "json",
          "body": {
            "type": "A",
            "name": "{{ item.item }}",
            "content": "10.10.10.10",
            "ttl": 300,
            "proxied": false
          },
          "status_code": 200
        },
        "loop": "{{ koipond_dns.results }}",
        "when": "item.json.result | length == 0",
        "delegate_to": "localhost",
        "become": false,
        "no_log": true,
        "vars": {
          "ansible_become": false
        }
      },
      {
        "name": "Pull isolated edge images",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "pull",
            "{{ item }}"
          ]
        },
        "loop": [
          "nginxinc/nginx-unprivileged:1.28-alpine",
          "certbot/dns-cloudflare:v5.1.0"
        ],
        "register": "koipond_pulls",
        "changed_when": true
      },
      {
        "name": "Resolve edge image identities",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "image",
            "inspect",
            "--format",
            "{% raw %}{{index .RepoDigests 0}}{% endraw %}",
            "{{ item }}"
          ]
        },
        "loop": [
          "nginxinc/nginx-unprivileged:1.28-alpine",
          "certbot/dns-cloudflare:v5.1.0"
        ],
        "register": "koipond_images",
        "changed_when": false
      },
      {
        "name": "Issue DNS01 certificate without opening web ports",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "run",
            "--rm",
            "-v",
            "/srv/koipond-edge/letsencrypt:/etc/letsencrypt",
            "-v",
            "/srv/koipond-edge/cloudflare.ini:/run/cloudflare.ini:ro",
            "{{ koipond_images.results[1].stdout }}",
            "certonly",
            "--dns-cloudflare",
            "--dns-cloudflare-credentials",
            "/run/cloudflare.ini",
            "--dns-cloudflare-propagation-seconds",
            "60",
            "--non-interactive",
            "--agree-tos",
            "--register-unsafely-without-email",
            "--cert-name",
            "koipond-private",
            "-d",
            "koipond-stage.kluge-it.tech",
            "-d",
            "koipond-api.kluge-it.tech",
            "--keep-until-expiring"
          ]
        },
        "async": 600,
        "poll": 5,
        "no_log": true
      },
      {
        "name": "Copy TLS certificate with restricted private key",
        "ansible.builtin.copy": {
          "src": "/srv/koipond-edge/letsencrypt/live/koipond-private/{{ item.name }}",
          "dest": "/srv/koipond-edge/tls/{{ item.name }}",
          "remote_src": true,
          "mode": "{{ item.mode }}",
          "group": "101"
        },
        "loop": [
          {
            "name": "fullchain.pem",
            "mode": "0644"
          },
          {
            "name": "privkey.pem",
            "mode": "0640"
          }
        ],
        "no_log": true
      },
      {
        "name": "Allow unprivileged nginx to traverse TLS directory",
        "ansible.builtin.file": {
          "path": "/srv/koipond-edge/tls",
          "group": "101",
          "mode": "0750"
        }
      },
      {
        "name": "Prepare private-only proxy configuration",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/nginx/default.conf",
          "content": "map $http_upgrade $connection_upgrade { default upgrade; '' close; }\nupstream koipond_web { least_conn; server 10.10.10.20:3100; server 10.10.10.20:3101; keepalive 16; }\nserver {\n listen 8443 ssl default_server;\n server_name koipond-stage.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;\n location ^~ /api/internal/worker/ { return 404; }\n location = /api/internal/metrics/instance1 { proxy_pass http://10.10.10.20:3100/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location = /api/internal/metrics/instance2 { proxy_pass http://10.10.10.20:3101/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location / {\n  proxy_pass http://koipond_web; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 120s;\n }\n}\nserver {\n listen 8443 ssl;\n server_name koipond-api.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;\n location ~ ^/(auth|rest|realtime|storage|functions)/v1(/|$) {\n  proxy_pass http://10.10.10.30:8000; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 3600s; proxy_buffering off;\n }\n location / { return 404; }\n}\n",
          "mode": "0644"
        }
      },
      {
        "name": "Prepare pinned edge compose",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/compose.yml",
          "mode": "0600",
          "content": "services:\n  nginx:\n    image: \"{{ koipond_images.results[0].stdout }}\"\n    restart: unless-stopped\n    ports: [\"10.10.10.10:443:8443\"]\n    volumes:\n      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro\n      - ./tls:/etc/nginx/tls:ro\n    mem_limit: 256m\n    cpus: 0.50\n    logging:\n      driver: json-file\n      options: {max-size: 10m, max-file: \"3\"}\n"
        }
      },
      {
        "name": "Validate private nginx configuration",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "compose",
            "-p",
            "koipond-edge",
            "-f",
            "/srv/koipond-edge/compose.yml",
            "run",
            "--rm",
            "nginx",
            "nginx",
            "-t"
          ]
        },
        "changed_when": false
      },
      {
        "name": "Start private reverse proxy",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "compose",
            "-p",
            "koipond-edge",
            "-f",
            "/srv/koipond-edge/compose.yml",
            "up",
            "-d",
            "--no-build"
          ]
        }
      },
      {
        "name": "Install direct edge renewal script",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/renew.sh",
          "mode": "0700",
          "content": "#!/bin/sh\nset -eu\nexec 9>/run/koipond-acme.lock\nflock -n 9 || exit 0\ndocker run --rm -v /srv/koipond-edge/letsencrypt:/etc/letsencrypt -v /srv/koipond-edge/cloudflare.ini:/run/cloudflare.ini:ro '{{ koipond_images.results[1].stdout }}' renew --non-interactive --quiet\ninstall -m 0644 -g 101 /srv/koipond-edge/letsencrypt/live/koipond-private/fullchain.pem /srv/koipond-edge/tls/fullchain.pem\ninstall -m 0640 -g 101 /srv/koipond-edge/letsencrypt/live/koipond-private/privkey.pem /srv/koipond-edge/tls/privkey.pem\ndocker compose -p koipond-edge -f /srv/koipond-edge/compose.yml exec -T nginx nginx -t\ndocker compose -p koipond-edge -f /srv/koipond-edge/compose.yml exec -T nginx nginx -s reload\n"
        }
      },
      {
        "name": "Install edge renewal unit",
        "ansible.builtin.copy": {
          "dest": "/etc/systemd/system/koipond-acme-renew.service",
          "mode": "0644",
          "content": "[Unit]\nDescription=Renew private Koipond TLS using DNS01\nAfter=docker.service network-online.target\n[Service]\nType=oneshot\nExecStart=/srv/koipond-edge/renew.sh\n"
        }
      },
      {
        "name": "Install edge renewal timer",
        "ansible.builtin.copy": {
          "dest": "/etc/systemd/system/koipond-acme-renew.timer",
          "mode": "0644",
          "content": "[Unit]\nDescription=Daily Koipond TLS renewal\n[Timer]\nOnCalendar=daily\nRandomizedDelaySec=2h\nPersistent=true\n[Install]\nWantedBy=timers.target\n"
        }
      },
      {
        "name": "Enable renewal directly on edge",
        "ansible.builtin.systemd_service": {
          "name": "koipond-acme-renew.timer",
          "enabled": true,
          "state": "started",
          "daemon_reload": true
        }
      }
    ]
  }
]