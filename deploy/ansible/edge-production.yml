[
  {
    "name": "Prepare inactive production edge and validate syntax only",
    "hosts": "koipond_edge",
    "gather_facts": false,
    "tags": [
      "prepare"
    ],
    "tasks": [
      {
        "name": "Require explicit inactive configuration preparation",
        "ansible.builtin.assert": {
          "that": [
            "koipond_prepare_production_edge | default(false) | bool"
          ]
        }
      },
      {
        "name": "Create inactive edge preparation directory",
        "ansible.builtin.file": {
          "path": "/srv/koipond-edge/production-preparation",
          "state": "directory",
          "mode": "0700"
        }
      },
      {
        "name": "Write inactive production config only",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/production-preparation/nginx-production.conf.inactive",
          "content": "map $http_upgrade $connection_upgrade { default upgrade; '' close; }\nupstream koipond_web { least_conn; server 10.10.10.20:3100; server 10.10.10.20:3101; keepalive 16; }\nserver {\n listen 8443 ssl default_server;\n server_name koipond-stage.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;\n location = /health/ready { proxy_pass http://10.10.10.20:3200/health/ready; proxy_set_header Host $host; }\n location = /api/internal/metrics { proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; }\n location ^~ /api/internal/worker/ { return 404; }\n location = /api/internal/metrics/instance1 { proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location = /api/internal/metrics/instance2 { proxy_pass http://10.10.10.20:3201/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location / {\n  proxy_pass http://koipond_web; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 120s;\n }\n}\nupstream koipond_production { least_conn; server 10.10.10.20:3200; server 10.10.10.20:3201; keepalive 16; }\nserver {\n listen 8080;\n server_name koipond.live www.koipond.live;\n return 308 https://www.koipond.live$request_uri;\n}\nserver {\n listen 8443 ssl;\n server_name koipond.live;\n ssl_certificate /etc/nginx/production-tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/production-tls/privkey.pem;\n return 308 https://www.koipond.live$request_uri;\n}\nserver {\n listen 8443 ssl;\n server_name www.koipond.live;\n ssl_certificate /etc/nginx/production-tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/production-tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n location ^~ /api/internal/worker/ { return 404; }\n location = /api/internal/metrics { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://koipond_production; proxy_set_header Host $host; }\n location = /api/internal/metrics/instance1 { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; }\n location = /api/internal/metrics/instance2 { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://10.10.10.20:3201/api/internal/metrics; proxy_set_header Host $host; }\n location = /health/ready { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://koipond_production; proxy_set_header Host $host; }\n location ^~ /api/internal/ { return 404; }\n location ^~ /api/cron/ { return 404; }\n location / {\n  proxy_pass http://koipond_production; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 120s;\n }\n}\nserver {\n listen 8443 ssl;\n server_name koipond-api.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n location ~ ^/(auth|rest|realtime|storage|functions)/v1(/|$) {\n  proxy_pass http://10.10.10.30:8000; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 3600s; proxy_buffering off;\n }\n location / { return 404; }\n}\n",
          "mode": "0644"
        }
      },
      {
        "name": "Prepare syntax-only config using current stage certificate as TEST CERTIFICATE",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/production-preparation/nginx-syntax-test.conf",
          "content": "map $http_upgrade $connection_upgrade { default upgrade; '' close; }\nupstream koipond_web { least_conn; server 10.10.10.20:3100; server 10.10.10.20:3101; keepalive 16; }\nserver {\n listen 8443 ssl default_server;\n server_name koipond-stage.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;\n location = /health/ready { proxy_pass http://10.10.10.20:3200/health/ready; proxy_set_header Host $host; }\n location = /api/internal/metrics { proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; }\n location ^~ /api/internal/worker/ { return 404; }\n location = /api/internal/metrics/instance1 { proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location = /api/internal/metrics/instance2 { proxy_pass http://10.10.10.20:3201/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }\n location / {\n  proxy_pass http://koipond_web; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 120s;\n }\n}\nupstream koipond_production { least_conn; server 10.10.10.20:3200; server 10.10.10.20:3201; keepalive 16; }\nserver {\n listen 8080;\n server_name koipond.live www.koipond.live;\n return 308 https://www.koipond.live$request_uri;\n}\nserver {\n listen 8443 ssl;\n server_name koipond.live;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n return 308 https://www.koipond.live$request_uri;\n}\nserver {\n listen 8443 ssl;\n server_name www.koipond.live;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n location ^~ /api/internal/worker/ { return 404; }\n location = /api/internal/metrics { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://koipond_production; proxy_set_header Host $host; }\n location = /api/internal/metrics/instance1 { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://10.10.10.20:3200/api/internal/metrics; proxy_set_header Host $host; }\n location = /api/internal/metrics/instance2 { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://10.10.10.20:3201/api/internal/metrics; proxy_set_header Host $host; }\n location = /health/ready { allow 10.1.0.0/24; allow 10.10.10.0/24; deny all; proxy_pass http://koipond_production; proxy_set_header Host $host; }\n location ^~ /api/internal/ { return 404; }\n location ^~ /api/cron/ { return 404; }\n location / {\n  proxy_pass http://koipond_production; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 120s;\n }\n}\nserver {\n listen 8443 ssl;\n server_name koipond-api.kluge-it.tech;\n ssl_certificate /etc/nginx/tls/fullchain.pem;\n ssl_certificate_key /etc/nginx/tls/privkey.pem;\n ssl_protocols TLSv1.2 TLSv1.3;\n location ~ ^/(auth|rest|realtime|storage|functions)/v1(/|$) {\n  proxy_pass http://10.10.10.30:8000; proxy_http_version 1.1;\n  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;\n  proxy_read_timeout 3600s; proxy_buffering off;\n }\n location / { return 404; }\n}\n",
          "mode": "0644"
        }
      },
      {
        "name": "Read currently pinned edge image",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "compose",
            "-p",
            "koipond-edge",
            "-f",
            "/srv/koipond-edge/compose.yml",
            "images",
            "--quiet",
            "nginx"
          ]
        },
        "register": "edge_image",
        "changed_when": false
      },
      {
        "name": "Validate inactive syntax without publishing ports or activating production certificate",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "run",
            "--rm",
            "--network",
            "none",
            "-v",
            "/srv/koipond-edge/production-preparation/nginx-syntax-test.conf:/etc/nginx/conf.d/default.conf:ro",
            "-v",
            "/srv/koipond-edge/tls:/etc/nginx/tls:ro",
            "{{ edge_image.stdout | trim }}",
            "nginx",
            "-t"
          ]
        },
        "changed_when": false
      },
      {
        "name": "Record explicit certificate limitation",
        "ansible.builtin.copy": {
          "dest": "/srv/koipond-edge/production-preparation/READINESS.txt",
          "mode": "0600",
          "content": "Syntax validated with stage TEST certificate only. No valid www.koipond.live/koipond.live certificate is prepared. Existing Cloudflare token cannot edit koipond.live. Activation requires separate real certificate acquisition and final approval. No DNS or active config changed.\n"
        }
      }
    ]
  },
  {
    "name": "Activate production edge only after real certificate and final approval",
    "hosts": "koipond_edge",
    "gather_facts": false,
    "tags": [
      "activate"
    ],
    "tasks": [
      {
        "name": "Require final approval, completed application activation and real certificate input",
        "ansible.builtin.assert": {
          "that": [
            "koipond_go_live_approved | default(false) | bool",
            "koipond_production_apps_ready | default(false) | bool",
            "koipond_production_certificate_ready | default(false) | bool"
          ]
        }
      },
      {
        "name": "Require real certificate/key already provisioned on edge",
        "ansible.builtin.stat": {
          "path": "{{ item }}"
        },
        "loop": [
          "/srv/koipond-edge/production-tls/fullchain.pem",
          "/srv/koipond-edge/production-tls/privkey.pem"
        ],
        "register": "cert_files"
      },
      {
        "name": "Require real production certificate files",
        "ansible.builtin.assert": {
          "that": [
            "cert_files.results | selectattr('stat.exists') | list | length == 2"
          ]
        }
      },
      {
        "name": "Verify certificate expiry for at least seven days",
        "ansible.builtin.command": {
          "argv": [
            "openssl",
            "x509",
            "-in",
            "/srv/koipond-edge/production-tls/fullchain.pem",
            "-noout",
            "-checkend",
            "604800"
          ]
        },
        "changed_when": false
      },
      {
        "name": "Verify trusted certificate chain and both production hostnames",
        "ansible.builtin.command": {
          "argv": [
            "openssl",
            "verify",
            "-CAfile",
            "/etc/ssl/certs/ca-certificates.crt",
            "-untrusted",
            "/srv/koipond-edge/production-tls/fullchain.pem",
            "-verify_hostname",
            "{{ item }}",
            "/srv/koipond-edge/production-tls/fullchain.pem"
          ]
        },
        "loop": [
          "www.koipond.live",
          "koipond.live"
        ],
        "changed_when": false
      },
      {
        "name": "Read currently pinned edge image",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "compose",
            "-p",
            "koipond-edge",
            "-f",
            "/srv/koipond-edge/compose.yml",
            "images",
            "--quiet",
            "nginx"
          ]
        },
        "register": "edge_image",
        "changed_when": false
      },
      {
        "name": "Set real certificate permissions for unprivileged edge",
        "ansible.builtin.file": {
          "path": "{{ item.path }}",
          "owner": "root",
          "group": "101",
          "mode": "{{ item.mode }}"
        },
        "loop": [
          {
            "path": "/srv/koipond-edge/production-tls",
            "mode": "0750"
          },
          {
            "path": "/srv/koipond-edge/production-tls/fullchain.pem",
            "mode": "0644"
          },
          {
            "path": "/srv/koipond-edge/production-tls/privkey.pem",
            "mode": "0640"
          }
        ]
      },
      {
        "name": "Validate actual inactive configuration with real production certificate and key",
        "ansible.builtin.command": {
          "argv": [
            "docker",
            "run",
            "--rm",
            "--network",
            "none",
            "-v",
            "/srv/koipond-edge/production-preparation/nginx-production.conf.inactive:/etc/nginx/conf.d/default.conf:ro",
            "-v",
            "/srv/koipond-edge/tls:/etc/nginx/tls:ro",
            "-v",
            "/srv/koipond-edge/production-tls:/etc/nginx/production-tls:ro",
            "{{ edge_image.stdout | trim }}",
            "nginx",
            "-t"
          ]
        },
        "changed_when": false
      },
      {
        "name": "Back up previous active private edge configuration",
        "ansible.builtin.tempfile": {
          "state": "directory",
          "path": "/srv/koipond-edge",
          "prefix": "rollback-production-"
        },
        "register": "edge_backup"
      },
      {
        "name": "Preserve previous compose and nginx config",
        "ansible.builtin.shell": "cp -p /srv/koipond-edge/compose.yml {{ edge_backup.path }}/compose.yml; cp -p /srv/koipond-edge/nginx/default.conf {{ edge_backup.path }}/default.conf"
      },
      {
        "block": [
          {
            "name": "Activate reviewed production nginx config only after approval",
            "ansible.builtin.copy": {
              "src": "/srv/koipond-edge/production-preparation/nginx-production.conf.inactive",
              "dest": "/srv/koipond-edge/nginx/default.conf",
              "remote_src": true,
              "mode": "0644"
            }
          },
          {
            "name": "Activate reviewed production edge port bindings",
            "ansible.builtin.copy": {
              "dest": "/srv/koipond-edge/compose.yml",
              "mode": "0600",
              "content": "services:\n  nginx:\n    image: \"{{ edge_image.stdout | trim }}\"\n    restart: unless-stopped\n    ports: [\"10.10.10.10:443:8443\", \"10.10.10.10:80:8080\"]\n    volumes:\n      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro\n      - ./tls:/etc/nginx/tls:ro\n      - ./production-tls:/etc/nginx/production-tls:ro\n    mem_limit: 256m\n    cpus: 0.50\n    logging:\n      driver: json-file\n      options: {max-size: 10m, max-file: \"3\"}\n"
            }
          },
          {
            "name": "Restart only own edge project with reviewed production bindings",
            "ansible.builtin.command": {
              "argv": [
                "docker",
                "compose",
                "-p",
                "koipond-edge",
                "-f",
                "/srv/koipond-edge/compose.yml",
                "up",
                "-d",
                "--no-build"
              ]
            }
          },
          {
            "name": "Verify nginx activated configuration",
            "ansible.builtin.command": {
              "argv": [
                "docker",
                "compose",
                "-p",
                "koipond-edge",
                "-f",
                "/srv/koipond-edge/compose.yml",
                "exec",
                "-T",
                "nginx",
                "nginx",
                "-t"
              ]
            },
            "changed_when": false
          }
        ],
        "rescue": [
          {
            "name": "Restore preactivation private config",
            "ansible.builtin.shell": "cp -p {{ edge_backup.path }}/compose.yml /srv/koipond-edge/compose.yml; cp -p {{ edge_backup.path }}/default.conf /srv/koipond-edge/nginx/default.conf"
          },
          {
            "name": "Restart previous private edge only",
            "ansible.builtin.command": {
              "argv": [
                "docker",
                "compose",
                "-p",
                "koipond-edge",
                "-f",
                "/srv/koipond-edge/compose.yml",
                "up",
                "-d",
                "--no-build"
              ]
            }
          },
          {
            "ansible.builtin.fail": {
              "msg": "Edge activation failed. Previous private configuration restored. No DNS or root firewall changes performed by this playbook."
            }
          }
        ]
      }
    ]
  }
]