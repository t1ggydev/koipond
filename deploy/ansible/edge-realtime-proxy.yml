- name: Public Realtime proxy on the Koipond application origin
  hosts: koipond_edge
  become: true
  gather_facts: false
  tasks:
    - name: Install the narrowly scoped Realtime location
      ansible.builtin.copy:
        src: files/koipond-realtime.conf
        dest: /srv/koipond-edge/production-tls/koipond-realtime.conf
        mode: '0644'
        backup: true
    - block:
        - name: Include only in the canonical public Koipond server
          ansible.builtin.lineinfile:
            path: /srv/koipond-edge/nginx/default.conf
            insertafter: '^ server_name www\.koipond\.live;$'
            line: ' include /etc/nginx/production-tls/koipond-realtime.conf;'
            backup: true
          register: edge_config
        - name: Validate the complete running configuration
          ansible.builtin.command: docker compose -f /srv/koipond-edge/compose.yml exec -T nginx nginx -t
          changed_when: false
        - name: Reload without restarting shared ingress
          ansible.builtin.command: docker compose -f /srv/koipond-edge/compose.yml exec -T nginx nginx -s reload
          changed_when: true
      rescue:
        - name: Restore the previous valid configuration when validation fails
          ansible.builtin.copy:
            src: '{{ edge_config.backup_file }}'
            dest: /srv/koipond-edge/nginx/default.conf
            remote_src: true
            mode: '0644'
          when: edge_config.backup_file is defined
        - ansible.builtin.fail:
            msg: Realtime ingress validation failed; previous config restored.
