map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream koipond_web { least_conn; server 10.10.10.20:3100; server 10.10.10.20:3101; keepalive 16; }
server {
 listen 8443 ssl default_server;
 server_name koipond-stage.kluge-it.tech;
 ssl_certificate /etc/nginx/tls/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;
 location ^~ /api/internal/worker/ { return 404; }
 location = /api/internal/metrics/instance1 { proxy_pass http://10.10.10.20:3100/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
 location = /api/internal/metrics/instance2 { proxy_pass http://10.10.10.20:3101/api/internal/metrics; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
 location / {
  proxy_pass http://koipond_web; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 120s;
 }
}
server {
 listen 8443 ssl;
 server_name koipond-api.kluge-it.tech;
 ssl_certificate /etc/nginx/tls/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 allow 10.1.0.0/24; allow 10.10.10.0/24; deny all;
 location ~ ^/(auth|rest|realtime|storage|functions)/v1(/|$) {
  proxy_pass http://10.10.10.30:8000; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3600s; proxy_buffering off;
 }
 location / {
  proxy_pass http://10.10.10.30:8000; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 120s;
 }
}
