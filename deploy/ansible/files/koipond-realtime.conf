# Public same-origin Realtime endpoint; never exposes Studio or other services.
location ^~ /supabase/realtime/v1/ {
 proxy_pass http://10.10.10.30:8000/realtime/v1/;
 proxy_http_version 1.1;
 proxy_set_header Host koipond-api.kluge-it.tech;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Cookie "";
 proxy_buffering off;
 proxy_read_timeout 3600s;
 proxy_send_timeout 3600s;
}
location ^~ /supabase/ { return 404; }
